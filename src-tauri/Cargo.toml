[package]
name = "craftora"
version = "0.6.0"
description = "Desktop media trimmer and downloader (yt-dlp + FFmpeg)"
authors = ["Cchheanglim"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "craftora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The AI assistant: the Gemini API key lives in Windows Credential Manager, and Rust makes the calls.
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Already in the build (through reqwest and others): reads the cover picture the editor sends (project.rs).
base64 = "0.22"
tokio = { version = "1", features = ["time"] }
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Already in the build through Tauri: lets "Forget" delete cookies with WebView2 itself (signin.rs).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# Also already in the build: job objects, so engines stop when Craftora closes (engine.rs `tie`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_Packaging_Appx", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }
# Also already in the build (through webview2-com): the PC's antivirus scans each download (scan.rs).
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }
# Windows notifications that know when they're clicked (notify.rs); already in the build before through tauri-plugin-notification.
tauri-winrt-notification = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
